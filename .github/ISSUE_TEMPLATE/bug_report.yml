
name: Bug Report
description: Report a problem or unexpected behavior.
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.
        Please provide enough information to reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe the problem.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Explain how to reproduce the issue.
      placeholder: |
        1. Run the command...
        2. Enter the repository...
        3. Observe the error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "3.12"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Output
      description: Include relevant error messages.
      render: shell
    validations:
      required: false
