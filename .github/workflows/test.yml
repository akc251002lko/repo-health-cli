name: Repo Health CLI CI

on:
  push:
    branches: [main, master, "chatgpt-write-access-check-2026-11-03"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-health-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source and tests
        run: python -m py_compile health.py tests/test_health.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI help smoke test
        run: python health.py --help
