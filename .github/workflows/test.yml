
name: Repository CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Python Syntax
        run: python -m py_compile health.py tests/test_health.py

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Check Public Repository Health
        if: matrix.python-version == '3.12'
        run: python health.py --repo "${{ github.repository }}"
